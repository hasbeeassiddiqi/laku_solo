<?php
// Konfigurasi database untuk XAMPP / MariaDB
$host = 'localhost';
$user = 'root';
$password = '';
$database = 'surakarta_culture';

// Membuat koneksi
$conn = new mysqli($host, $user, $password, $database);

// Mengecek koneksi (menyimpan statusnya ke dalam variabel untuk ditampilkan di HTML)
if ($conn->connect_error) {
    $status_koneksi = "<span style='color: red;'>Koneksi database gagal: " . $conn->connect_error . "</span>";
} else {
    $status_koneksi = "<span style='color: green;'>Koneksi database berhasil ke: <strong>" . $database . "</strong></span>";
}

$conn->set_charset('utf8mb4');
?>
